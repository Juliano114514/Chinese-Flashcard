name: Android CI and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the current main version (bootstrap or retry)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read version and release intent
        id: version
        run: python3 tools/ci_release.py

  build:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.0.0"'
      - name: Prepare pinned stroke sources (cache only)
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          import build_wordlist_strokes as strokes
          strokes.MM_CACHE.mkdir(parents=True, exist_ok=True)
          (strokes.MM_CACHE / 'revision.txt').write_text(strokes.MM_REVISION, encoding='utf-8')
          strokes.read_sources(check=False)
          PY
      - name: Check frozen data and generated assets
        run: |
          python3 tools/rebuild_wordlist.py --check
          python3 tools/build_wordlist_strokes.py --check
          python3 tools/build_demo.py --check
      - name: Lint and compile Debug
        run: bash ./gradlew --no-daemon :app:lintDebug :app:assembleDebug
      - name: Compile unsigned Release
        if: needs.version.outputs.publish == 'true'
        run: bash ./gradlew --no-daemon :app:assembleRelease
      - name: Upload Debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: Chinese-Flashcard-debug-${{ needs.version.outputs.version }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned Release for signing
        if: needs.version.outputs.publish == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.*
          retention-days: 14

  release:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-${{ needs.version.outputs.tag }}
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
      TAG: ${{ needs.version.outputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Guard existing tags and published releases
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA" || {
              echo '::error::Version tag belongs to a different commit. Increase the version instead of replacing it.'
              exit 1
            }
          fi
          published=false
          if gh release view "$TAG" --json isDraft,targetCommitish > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'existing-release.json').read_text())
          if release['isDraft'] and release['targetCommitish'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Existing draft targets another commit; do not replace it')
          PY
            published=$(python3 -c 'import json,sys; print(str(not json.load(open(sys.argv[1]))["isDraft"]).lower())' "$RUNNER_TEMP/existing-release.json")
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7, Node 24
        if: steps.existing.outputs.published != 'true'
        with:
          name: unsigned-release
          path: unsigned
      - name: Install signing tools
        if: steps.existing.outputs.published != 'true'
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - name: Sign and verify Release APK
        if: steps.existing.outputs.published != 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/release-signing.jks"
          trap 'rm -f "$key_file"' EXIT
          export KEY_FILE="$key_file"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ('ANDROID_KEYSTORE_BASE64', 'ANDROID_STORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD')
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing repository secrets: ' + ', '.join(missing))
          encoded = ''.join(os.environ['ANDROID_KEYSTORE_BASE64'].split())
          if len(encoded) > 65536:
              raise SystemExit('Keystore secret exceeds the expected size limit')
          Path(os.environ['KEY_FILE']).write_bytes(base64.b64decode(encoded, validate=True))
          PY
          unset ANDROID_KEYSTORE_BASE64
          tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist
          apk="dist/Chinese_Flashcard_v${VERSION}.apk"
          "$tools/zipalign" -P 16 -f 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$key_file" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_STORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify "$apk"
          "$tools/zipalign" -c -P 16 4 "$apk"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'apk-badging.txt').read_text()
          assert "name='com.example.chinese_flashcard'" in text
          assert f"versionName='{os.environ['VERSION']}'" in text
          assert f"versionCode='{os.environ['VERSION_CODE']}'" in text
          assert 'application-debuggable' not in text
          print('APK identity, version and non-debuggable status verified')
          PY
          (cd dist && sha256sum "Chinese_Flashcard_v${VERSION}.apk" > SHA256SUMS.txt)
          python3 tools/ci_release.py --notes dist/release-notes.md
      - name: Publish GitHub Release
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Chinese Flashcard $VERSION" \
              --draft --notes-file dist/release-notes.md
          fi
          gh release upload "$TAG" "dist/Chinese_Flashcard_v${VERSION}.apk" dist/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --latest --notes-file dist/release-notes.md
          gh release view "$TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
